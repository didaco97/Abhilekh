  <text x="96" y="130" font-family="Nirmala UI, Noto Sans Devanagari, Mangal, sans-serif" font-size="76" text-anchor="middle" fill="#f7f4ed">अ</text>
  <text x="177" y="116" font-family="Georgia, serif" font-size="88" letter-spacing="-4" fill="#19373d">abhilekh<tspan fill="#a84930">.</tspan></text>
  <text x="182" y="151" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4.3" fill="#19373d">THE AMBEDKAR ARCHIVE</text>
