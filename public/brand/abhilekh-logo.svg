  <title id="title">Abhilekh — The Ambedkar Archive</title>
  <desc id="desc">The letter अ in a dark teal archival arch beside the Abhilekh wordmark on warm paper.</desc>
  <rect width="820" height="200" rx="6" fill="#f7f4ed"/>
